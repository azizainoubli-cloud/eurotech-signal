name: Update data and publish

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 Paris (winter)
    - cron: "0 19 * * *"  # 20:00 Paris (winter), after the evening news scan
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every year (1) or only recent years (0)"
        default: "0"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data snapshot from Tech.eu
        run: node scripts/build-data.mjs
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
      - name: Save the snapshot in the repository
        run: |
          git config user.name "eurotech-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update funding data [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
